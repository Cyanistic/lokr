name: Build and deploy

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the published image through Komodo
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            LOKR_COMMIT_HASH=${{ github.sha }}
          tags: |
            ghcr.io/cyanistic/lokr:main
            ghcr.io/cyanistic/lokr:${{ github.sha }}

      - name: Deploy Lokr through Komodo
        if: ${{ inputs.deploy }}
        env:
          KOMODO_URL: ${{ secrets.KOMODO_URL }}
          KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
          KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
        run: |
          set -eu
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "${KOMODO_URL%/}/execute/DeployStack" \
            --header "Content-Type: application/json" \
            --header "X-Api-Key: ${KOMODO_API_KEY}" \
            --header "X-Api-Secret: ${KOMODO_API_SECRET}" \
            --data '{"stack":"lokr"}'
